[project]
name = "ComfyUI-Krea2-Harness"
version = "0.1.0"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "ANe5s"}]
description = "In Krea2 Harness, a short prompt, a moodboard style you like, and an aesthetic LoRA can spark unlimited creativity."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["comfyui", "krea", "krea2", "harness", "prompt-sanitizer", "moodboards"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/ANe5s/ComfyUI-Krea2-Harness"
Issues = "https://github.com/ANe5s/ComfyUI-Krea2-Harness/issues"

[tool.comfy]
PublisherId = "ane5s"
DisplayName = "ComfyUI-Krea2-Harness"
Icon = "https://raw.githubusercontent.com/ANe5s/ComfyUI-Krea2-Harness/main/assets/registry/Icon.png"
Banner = "https://raw.githubusercontent.com/ANe5s/ComfyUI-Krea2-Harness/main/assets/registry/Banner.png"
requires-comfyui = ">=0.3.0"
includes = [
  "locales/en/main.json",
  "locales/en/nodeDefs.json",
  "locales/zh/main.json",
  "locales/zh/nodeDefs.json",
]
