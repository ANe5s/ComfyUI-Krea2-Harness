[project]
name = "krea2-harness"
version = "0.1.0a1"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "ANe5s"}]
description = "Krea2 Harness V0.1Alpha production prompt and moodboard nodes for ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["comfyui", "krea", "krea2", "harness", "prompt-sanitizer", "moodboards"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

[tool.comfy]
PublisherId = "ane5s"
DisplayName = "Krea2-Harness"
requires-comfyui = ">=0.3.0"
includes = [
  "locales/en/main.json",
  "locales/en/nodeDefs.json",
  "locales/zh/main.json",
  "locales/zh/nodeDefs.json",
]
